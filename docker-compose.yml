version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OVERLEAF_SESSION_COOKIE=${OVERLEAF_SESSION_COOKIE}
      - OVERLEAF_GCLB_TOKEN=${OVERLEAF_GCLB_TOKEN}
      - FRONTEND_URL=http://localhost:3000
      - PORT=3001
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
